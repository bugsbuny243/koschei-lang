[build]
buildCommand = "python -m unittest -v tests.test_native_value_domains_v1 tests.test_native_value_domains_adversarial_v1 tests.test_native_value_domains_scale_v1 tests.test_native_value_domains_execution_v1 tests.test_native_value_domains_execution_adversarial_v1 tests.test_native_value_domain_backend_materialization_v1 tests.test_native_relationship_v1 tests.test_native_relationship_execution_v1 tests.test_native_relationship_execution_adversarial_v1 tests.test_native_relationship_adversarial_v1 tests.test_native_relationship_scale_v1 tests.test_native_kernel_v1 tests.test_native_kernel_adversarial_v1 tests.test_native_kernel_scale_adversarial_v1"

[deploy]
