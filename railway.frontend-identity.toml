[build]
buildCommand = "python -m unittest -v tests.test_authenticated_frontend_identity_v1 tests.test_authenticated_frontend_identity_adversarial_v1 tests.test_native_kernel_v1 tests.test_native_kernel_adversarial_v1 tests.test_native_kernel_order_invariance_v1 tests.test_native_kernel_scale_adversarial_v1 tests.test_object_space_graph_v1 tests.test_object_space_graph_adversarial_v1"

[deploy]
startCommand = "python -c \"import time; print('frontend-identity redteam passed'); time.sleep(3600)\""
restartPolicyType = "NEVER"
