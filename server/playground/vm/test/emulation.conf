# TEST ONLY: drop-in for a QEMU/TCG-emulated VM (about 20x slower than real
# hardware). Scales the time limits so the interpreter can start; never
# install on a real worker, where the defaults (5 s CPU, 10 s wall) apply.
[Service]
Environment=KOSCHEI_UNTRUSTED_CPU_SECONDS=60
Environment=KOSCHEI_UNTRUSTED_WALL_SECONDS=120
TimeoutStartSec=1800
