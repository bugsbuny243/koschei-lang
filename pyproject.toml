[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "koschei-lang"
version = "0.10.0"
description = "Koschei — a native security programming language with constitutional execution physics and optional Khar-bounded Lang intelligence"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Onur Sel" }]
keywords = [
    "programming-language",
    "compiler",
    "native-security-language",
    "constitutional-security",
    "capability-security",
    "supply-chain-security",
    "ai-security",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Compilers",
    "Topic :: Security",
]

# The compiler core remains Python-standard-library only. Qwen training and
# inference are optional Lang research outside the compiler dependency graph and
# enter Koschei only through sealed native-intelligence identities/evidence.
# Koschei Sentinel is frozen and is not a Lang dependency.
dependencies = []

[project.urls]
Homepage = "https://github.com/bugsbuny243/koschei-lang"
Repository = "https://github.com/bugsbuny243/koschei-lang"
Issues = "https://github.com/bugsbuny243/koschei-lang/issues"

[project.scripts]
koschei = "koschei.cli_entry:main"
ks = "koschei.cli_entry:main"
ks-lsp = "koschei.lsp_v5:main"
ks-stdlib = "koschei.stdlib_catalog:main"
ks-differential-fuzz = "koschei.differential_fuzz_cli:main"
ks-foundation-export = "koschei.foundation_export_cli:main"
ks-model-curriculum = "koschei.model_curriculum_cli:main"
ks-native-model-curriculum = "koschei.native_model_curriculum_cli_v2:main"
ks-native-training-corpus = "koschei.native_intelligence_training_corpus_cli_v1:main"
ks-lang-boundary = "koschei.lang_project_boundary_v1:main"
ks-local-validate = "koschei.local_validation_cli:main"
ks-universe = "koschei.universe_cli:main"
ks-universe-remote = "koschei.universe_remote_app_v1:main"

[tool.setuptools]
packages = ["koschei"]

[tool.setuptools.package-data]
koschei = ["py.typed"]

# Generated native binaries embed the single audited data-json/v1 Go core.
# Keep that source in wheels instead of maintaining a second copied runtime.
[tool.setuptools.data-files]
"share/koschei/native/datajson" = ["native/datajson/json.go"]
