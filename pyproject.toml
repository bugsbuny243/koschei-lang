[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "koschei-lang"
version = "0.10.0"
description = "Koschei — a capability-secure programming language where an imported package cannot touch the disk or network without a token"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Onur Sel" }]
keywords = [
    "programming-language",
    "compiler",
    "capability-security",
    "object-capability",
    "supply-chain-security",
    "sandbox",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Compilers",
    "Topic :: Security",
]

# Bağımlılık YOKTUR ve olmayacaktır: derleyicinin kendisi yalnızca Python
# standart kütüphanesine dayanır. Bir güvenlik dilinin kurulumu, güvenmek
# zorunda olduğunuz paket sayısını artırmamalıdır.
dependencies = []

[project.urls]
Homepage = "https://github.com/bugsbuny243/koschei-lang"
Repository = "https://github.com/bugsbuny243/koschei-lang"
Issues = "https://github.com/bugsbuny243/koschei-lang/issues"

[project.scripts]
koschei = "koschei.cli_entry:main"
ks = "koschei.cli_entry:main"
ks-lsp = "koschei.lsp_v5:main"
ks-stdlib = "koschei.stdlib_catalog:main"
ks-differential-fuzz = "koschei.differential_fuzz_cli:main"
ks-foundation-export = "koschei.foundation_export_cli:main"
ks-model-curriculum = "koschei.model_curriculum_cli:main"

[tool.setuptools]
packages = ["koschei"]

[tool.setuptools.package-data]
koschei = ["py.typed"]

# Generated native binaries embed the single audited data-json/v1 Go core.
# Keep that source in wheels instead of maintaining a second copied runtime.
[tool.setuptools.data-files]
"share/koschei/native/datajson" = ["native/datajson/json.go"]
