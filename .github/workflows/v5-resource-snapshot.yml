name: V5 Resource Contract Snapshot

on:
  pull_request:

permissions:
  contents: read

jobs:
  snapshot:
    if: github.event.pull_request.head.ref == 'agent/v5-resource-contracts'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v5-resource-contracts
      - uses: actions/upload-artifact@v4
        with:
          name: koschei-resource-source
          path: |
            .
            !.git
          include-hidden-files: true
          if-no-files-found: error
