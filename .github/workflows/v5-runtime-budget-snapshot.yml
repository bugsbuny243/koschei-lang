name: V5 Runtime Budget Source Snapshot

on:
  pull_request:

permissions:
  contents: read

jobs:
  snapshot:
    if: github.event.pull_request.head.ref == 'agent/v5-runtime-budgets'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: agent/v5-runtime-budgets
      - name: Upload exact source tree
        uses: actions/upload-artifact@v4
        with:
          name: koschei-runtime-budget-source
          path: |
            .
            !.git
          include-hidden-files: true
          if-no-files-found: error
