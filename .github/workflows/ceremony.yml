name: Koschei Ceremony Report

# Automatic GitHub-hosted CI is disabled. This benchmark recipe is retained for
# manual use only; release evidence comes from `ks-local-validate --profile full`.
on:
  workflow_dispatch:

jobs:
  ceremony:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . pytest
      - name: Check benchmark programs and report ratios
        run: ./bench/ceremony/check.sh
