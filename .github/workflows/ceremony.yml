name: Koschei Ceremony Report

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ceremony:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Check benchmark programs and report ratios
        run: ./bench/ceremony/check.sh
