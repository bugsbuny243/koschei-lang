name: Playground Live Isolation Acceptance

# The worker runs as a systemd service directly on a Linux VM. A GitHub-hosted
# Ubuntu 24.04 runner is such a VM (systemd, cgroup v2, AppArmor with
# kernel.apparmor_restrict_unprivileged_userns=1), so this job installs the
# real unit and proves isolation on real hardware. Docker is not used:
# bubblewrap cannot create its namespaces under Docker's default seccomp
# profile and masked /proc without weakening the container (see
# server/playground/README.md, "Why not Docker").

on:
  push:
    branches:
      - 'security/playground-*'
    paths:
      - 'koschei/untrusted.py'
      - 'koschei/playground_remote.py'
      - 'server/playground/**'
      - '.github/workflows/playground-live-security.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vm-worker:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4

      - name: Record host security state
        run: |
          uname -r
          cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns
          test -f /sys/fs/cgroup/cgroup.controllers && echo "cgroup v2"

      - name: Install the worker unit (fails if the isolation probe fails)
        run: |
          sudo apt-get update -q
          sudo sh server/playground/vm/install.sh "$GITHUB_WORKSPACE" localhost 127.0.0.1/32 127.0.0.1
          for i in $(seq 1 120); do ss -Htln 'sport = :8443' | grep -q . && break; sleep 1; done
          ss -Htln 'sport = :8443' | grep -q .

      - name: Black-box acceptance over TLS
        run: sudo /opt/koschei-worker/venv/bin/python server/playground/vm/test/acceptance.py https://localhost:8443

      - name: Weakened isolation must stop the worker
        run: sudo sh server/playground/vm/test/degrade.sh

      - name: Network isolation (egress denied, peer allowlist)
        run: |
          out=$(sudo sh server/playground/vm/test/network.sh)
          echo "$out"
          echo "$out" | grep -q '^egress_public_ip: BLOCKED'
          echo "$out" | grep -q '^peer_not_allowed.*BLOCKED'
          echo "$out" | grep -q '^peer_allowed.*TLS_HANDSHAKE_OK'

      - name: Save worker journal
        if: always()
        run: sudo journalctl -u koschei-worker --no-pager -o cat > worker-journal.log || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playground-vm-worker-${{ github.sha }}
          path: worker-journal.log
          if-no-files-found: warn
          retention-days: 14
