name: Publish to PyPI

# Run by hand from the Actions tab. Uploads the version in pyproject.toml to
# PyPI through Trusted Publishing: PyPI trusts this workflow in this
# repository, so no API token is stored anywhere.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel and source distribution
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - name: Smoke-test the wheel
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/ks version
          /tmp/smoke/bin/ks check examples/hello.ks
          echo '{"jsonrpc":"2.0","id":1,"method":"ping"}' | /tmp/smoke/bin/koschei-lang
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
