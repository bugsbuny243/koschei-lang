name: Koschei Commerce core integration

on:
  push:
    branches:
      - 'feat/koschei-commerce-*'
  pull_request:
    paths:
      - 'products/commerce/**'
      - 'tests/test_commerce_mvp_v1.py'
      - '.github/workflows/commerce-core.yml'

permissions:
  contents: read

jobs:
  commerce-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Koschei runtime and tests
        run: python -m pip install -e . pytest
      - name: Run commerce integration tests with actual Koschei pricing engine
        run: python -m pytest -q tests/test_commerce_mvp_v1.py
      - name: Check Koschei pricing source and restricted capabilities
        run: |
          ks check products/commerce/pricing.ks
          ks caps products/commerce/pricing.ks
      - name: Verify Python syntax and browser JavaScript syntax
        run: |
          python -m py_compile products/commerce/storage.py products/commerce/server.py products/commerce/entrypoint.py
          node -e 'const fs=require("fs"),vm=require("vm");let s=fs.readFileSync("products/commerce/storefront.html","utf8");const m=s.match(/<script nonce="__NONCE__">([\s\S]*?)<\/script>/);if(!m)throw Error("Script missing");new vm.Script(m[1]);console.log("Storefront JS syntax OK")'
      - name: Build container and test startup with durable SQLite volume
        run: |
          docker build -f products/commerce/Dockerfile -t koschei-commerce-ci .
          docker volume create koschei-commerce-ci-data
          docker run -d --name koschei-commerce-ci \
            -p 127.0.0.1:18123:8080 \
            -v koschei-commerce-ci-data:/data \
            -e COMMERCE_PUBLIC_ORIGIN=http://127.0.0.1:18123 \
            -e COMMERCE_ADMIN_PASSWORD=ci-only-nonproduction-test-password \
            -e COMMERCE_ACCEPT_ORDERS=0 \
            koschei-commerce-ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18123/health; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18123/api/config | python -c "import sys,json; d=json.load(sys.stdin); assert d['orders_enabled'] is False and d['payments_enabled'] is False"
          docker exec koschei-commerce-ci python -c 'from pathlib import Path; p=Path("/proc/1/status").read_text(); assert int(p.split("Uid:")[1].split()[0])!=0, "HTTP server must run without root privileges"; assert Path("/data/commerce.db").is_file()'
          docker rm -f koschei-commerce-ci
          docker volume rm koschei-commerce-ci-data
