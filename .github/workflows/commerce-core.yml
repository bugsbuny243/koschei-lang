name: Koschei Commerce core integration

on:
  push:
    branches:
      - 'feat/koschei-commerce-*'
  pull_request:
    paths:
      - 'products/commerce/**'
      - 'tests/test_commerce_mvp_v1.py'
      - '.github/workflows/commerce-core.yml'

permissions:
  contents: read

jobs:
  commerce-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Koschei runtime and tests
        run: python -m pip install -e . pytest
      - name: Run commerce integration tests with actual Koschei pricing engine
        run: python -m pytest -q tests/test_commerce_mvp_v1.py
      - name: Check Koschei pricing source and restricted capabilities
        run: |
          ks check products/commerce/pricing.ks
          ks caps products/commerce/pricing.ks
      - name: Verify Python syntax and browser JavaScript syntax
        run: |
          python -m py_compile products/commerce/storage.py products/commerce/server.py
          node -e 'const fs=require("fs"),vm=require("vm");let s=fs.readFileSync("products/commerce/storefront.html","utf8");const m=s.match(/<script nonce="__NONCE__">([\s\S]*?)<\/script>/);if(!m)throw Error("Script missing");new vm.Script(m[1]);console.log("Storefront JS syntax OK")'
