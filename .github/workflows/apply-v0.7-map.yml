# Safe one-shot merge for PR #58.
name: Apply v0.7 Map patch

on:
  push:
    branches:
      - agent/v0.7-map
    paths:
      - .github/workflows/apply-v0.7-map.yml
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
    paths:
      - .github/workflows/apply-v0.7-map.yml

permissions:
  contents: write

jobs:
  apply-map:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/v0.7-map
          fetch-depth: 0

      - name: Merge Map changes onto current main
        shell: bash
        run: |
          set +e
          (
            set -euo pipefail

            patch_file="/tmp/v0.7-map.patch"
            exact_base_archive="/tmp/v0.7-map-exact-base.tar.gz"
            exact_base_dir="/tmp/v0.7-map-exact-base"
            base_dir="/tmp/v0.7-map-base"
            patched_dir="/tmp/v0.7-map-patched"

            base64 --decode .github/v0.7-map.patch.gz.b64 \
              | gzip --decompress > "$patch_file"
            cat \
              .github/v0.7-map-base-00 \
              .github/v0.7-map-base-01 \
              .github/v0.7-map-base-02 \
              | base64 --decode > "$exact_base_archive"

            mkdir -p "$exact_base_dir" "$base_dir" "$patched_dir"
            tar -xzf "$exact_base_archive" -C "$exact_base_dir"

            modified_files=(
              README.md
              docs/language-core.md
              koschei/ast_nodes.py
              koschei/capabilities.py
              koschei/codegen_go.py
              koschei/diagnostics.py
              koschei/formatter.py
              koschei/interpreter.py
              koschei/parser.py
              koschei/semantic.py
            )

            for file in "${modified_files[@]}"; do
              mkdir -p "$base_dir/$(dirname "$file")"
              cp "$file" "$base_dir/$file"
            done

            exact_base_files=(
              koschei/codegen_go.py
              koschei/diagnostics.py
              koschei/interpreter.py
              koschei/semantic.py
            )
            for file in "${exact_base_files[@]}"; do
              cp "$exact_base_dir/$file" "$base_dir/$file"
            done

            cp -a "$base_dir/." "$patched_dir/"
            git -C "$patched_dir" init -q
            git -C "$patched_dir" apply "$patch_file"

            for file in "${modified_files[@]}"; do
              merged="$(mktemp)"
              if ! git merge-file -p \
                "$file" \
                "$base_dir/$file" \
                "$patched_dir/$file" > "$merged"; then
                echo "CONFLICT: $file"
                cat "$merged"
                exit 1
              fi
              mv "$merged" "$file"
            done

            cp "$patched_dir/examples/maps.ks" examples/maps.ks
            cp "$patched_dir/tests/test_maps.py" tests/test_maps.py

            rm -f \
              .github/v0.7-map.patch.gz.b64 \
              .github/v0.7-map-base-00 \
              .github/v0.7-map-base-01 \
              .github/v0.7-map-base-02 \
              .github/map-merge.log \
              .github/workflows/apply-v0.7-map.yml

            git diff --check
          ) > /tmp/map-merge.log 2>&1
          status=$?

          if [ "$status" -ne 0 ]; then
            git reset --hard HEAD
            git clean -fd
            cp /tmp/map-merge.log .github/map-merge.log
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/map-merge.log
            git commit -m "chore: capture Map merge failure"
            git push origin HEAD:agent/v0.7-map
            cat /tmp/map-merge.log
            exit "$status"
          fi

      - name: Run test suite
        run: python -m unittest discover -s tests -v

      - name: Validate Map example
        shell: bash
        run: |
          set -euo pipefail
          python -m koschei check examples/maps.ks
          python -m koschei run examples/maps.ks
          python -m koschei fmt --check examples/maps.ks

      - name: Commit merged implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "v0.7: add immutable Map support"
          git push origin HEAD:agent/v0.7-map
