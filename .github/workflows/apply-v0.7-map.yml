# Safe one-shot merge for PR #58.
name: Apply v0.7 Map patch

on:
  push:
    branches:
      - agent/v0.7-map
    paths:
      - .github/workflows/apply-v0.7-map.yml
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
    paths:
      - .github/workflows/apply-v0.7-map.yml

permissions:
  contents: write

jobs:
  apply-map:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/v0.7-map
          fetch-depth: 0

      - name: Merge Map changes onto current main
        shell: bash
        run: |
          set -euo pipefail

          base_commit="5511e7f0c783444b0e5d78bdf7b45061995e9c54"
          patch_file="/tmp/v0.7-map.patch"
          patched_tree="/tmp/koschei-map-patched"
          base_files="/tmp/koschei-map-base"

          base64 --decode .github/v0.7-map.patch.gz.b64 | gzip --decompress > "$patch_file"
          git worktree add --detach "$patched_tree" "$base_commit"
          mkdir -p "$base_files"

          modified_files=(
            README.md
            docs/language-core.md
            koschei/ast_nodes.py
            koschei/capabilities.py
            koschei/codegen_go.py
            koschei/diagnostics.py
            koschei/formatter.py
            koschei/interpreter.py
            koschei/parser.py
            koschei/semantic.py
          )

          for file in "${modified_files[@]}"; do
            mkdir -p "$base_files/$(dirname "$file")"
            cp "$patched_tree/$file" "$base_files/$file"
          done

          git -C "$patched_tree" apply "$patch_file"

          for file in "${modified_files[@]}"; do
            merged="$(mktemp)"
            git merge-file -p --union \
              "$file" \
              "$base_files/$file" \
              "$patched_tree/$file" > "$merged" || true
            mv "$merged" "$file"
          done

          cp "$patched_tree/examples/maps.ks" examples/maps.ks
          cp "$patched_tree/tests/test_maps.py" tests/test_maps.py

          rm .github/v0.7-map.patch.gz.b64
          rm .github/workflows/apply-v0.7-map.yml
          git worktree remove --force "$patched_tree"
          git diff --check

      - name: Run test suite
        run: python -m unittest discover -s tests -v

      - name: Validate Map example
        shell: bash
        run: |
          set -euo pipefail
          python -m koschei check examples/maps.ks
          python -m koschei run examples/maps.ks
          python -m koschei fmt --check examples/maps.ks

      - name: Commit merged implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "v0.7: add immutable Map support"
          git push origin HEAD:agent/v0.7-map
