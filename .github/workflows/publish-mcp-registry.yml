name: Publish to the MCP Registry

# Run by hand from the Actions tab, after the same version is on PyPI.
# Publishes server.json to the official MCP Registry. GitHub proves the
# repository's identity through OIDC, so no token is stored anywhere.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mcp-publisher
        run: |
          curl -sSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
      - name: Validate server.json
        run: ./mcp-publisher validate
      - name: Log in with GitHub OIDC
        run: ./mcp-publisher login github-oidc
      - name: Publish
        run: ./mcp-publisher publish
