name: Koschei Compiler Tests

on:
  push:
    branches:
      - main
      - agent/**
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Install package and test runner
        run: python -m pip install -e . pytest

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Check capability example
        run: python -m koschei check examples/capability.ks

      - name: Check runtime demo
        run: python -m koschei check examples/runtime_demo.ks

      - name: Run runtime demo
        run: python -m koschei run examples/runtime_demo.ks

      - name: Check control flow example
        run: python -m koschei check examples/control_flow.ks

      - name: Run control flow example
        run: |
          output="$(python -m koschei run examples/control_flow.ks)"
          test "$output" = $'3\n2\n1\nKoschei control flow: PASS'

      - name: Build native binary
        run: python -m koschei build examples/hello.ks -o /tmp/koschei-hello

      - name: Native binary matches interpreter
        run: |
          native="$(/tmp/koschei-hello)"
          interpreted="$(python -m koschei run examples/hello.ks)"
          test "$native" = "$interpreted"

      - name: Native capability runtime matches interpreter
        run: |
          python -m koschei build examples/runtime_demo.ks -o /tmp/koschei-runtime
          native="$(KOSCHEI_RUNTIME_NAME=Native /tmp/koschei-runtime)"
          interpreted="$(KOSCHEI_RUNTIME_NAME=Native python -m koschei run examples/runtime_demo.ks)"
          test "$native" = "$interpreted"
          case "$native" in
            *"Merhaba Native"*) ;;
            *) echo "HATA: native capability runtime beklenen env çıktısını vermedi" >&2; exit 1 ;;
          esac

      - name: Validate v0.10 diagnostics and project tools
        shell: bash
        run: |
          set -euo pipefail
          python -m koschei version | grep -F "Koschei 0.10.0"
          python -m koschei check --json examples/hello.ks \
            | python -c 'import json,sys; data=json.load(sys.stdin); assert data["ok"] and data["modules"] == 1'
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          python -m koschei new ci-project --path "$tmp/ci-project"
          python -m koschei check --json "$tmp/ci-project" \
            | python -c 'import json,sys; assert json.load(sys.stdin)["ok"]'
          python -m koschei run "$tmp/ci-project" | grep -F "Hello from ci-project"
          python -m koschei build "$tmp/ci-project" -o "$tmp/app"
          test "$("$tmp/app")" = "Hello from ci-project"

      - name: Validate VS Code extension
        shell: bash
        run: |
          set -euo pipefail
          cd editors/vscode
          npm install
          npm run compile
          npm test

      - name: Validate LSP smoke test
        shell: bash
        run: |
          set -euo pipefail
          python tools/lsp_smoke.py

      - name: Validate package build
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install build
          python -m build

      - name: Validate generated native tests
        shell: bash
        run: |
          set -euo pipefail
          python tools/run_native_generated_tests.py

      - name: Validate native capability parity
        shell: bash
        run: |
          set -euo pipefail
          python tools/run_native_capability_parity.py

      - name: Validate runtime capability registry parity
        shell: bash
        run: |
          set -euo pipefail
          python tools/run_runtime_capability_parity.py

      - name: Validate runtime boot parity
        shell: bash
        run: |
          set -euo pipefail
          python tools/run_runtime_boot_parity.py

      - name: Validate request proof binding
        shell: bash
        run: |
          set -euo pipefail
          python tools/run_request_proof_binding.py

      - name: Validate policy gate
        shell: bash
        run: |
          set -euo pipefail
          python tools/run_policy_gate.py

      - name: Validate supply chain rejection
        shell: bash
        run: |
          set -euo pipefail
          python tools/run_supply_chain_rejection.py

      - name: Validate format
        shell: bash
        run: |
          set -euo pipefail
          python tools/format_check.py

      - name: Validate foundation export
        shell: bash
        run: |
          set -euo pipefail
          python tools/run_foundation_export.py

      - name: Validate model curriculum
        shell: bash
        run: |
          set -euo pipefail
          python tools/run_model_curriculum.py

      - name: Validate native model curriculum
        shell: bash
        run: |
          set -euo pipefail
          python tools/run_native_model_curriculum.py
