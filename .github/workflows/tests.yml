name: Koschei Compiler Tests

# GitHub-hosted Actions are not part of the canonical validation boundary for
# this repository. The hosted Free-plan allowance is unavailable, so automatic
# push/PR runs would only create false-red status noise. Keep this workflow as a
# manual fallback recipe; the real path is `ks-local-validate --profile full`
# with receipt/evidence stored outside the checkout.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Install package and local validator dependencies
        run: python -m pip install -e . pytest

      - name: Run canonical full validation recipe
        run: |
          ks-local-validate \
            --profile full \
            --output /tmp/koschei-local-validation.json \
            --evidence-dir /tmp/koschei-validation-evidence

      - name: Upload sealed validation receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: koschei-local-validation
          path: |
            /tmp/koschei-local-validation.json
            /tmp/koschei-validation-evidence
          if-no-files-found: warn
