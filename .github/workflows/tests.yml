name: Koschei Compiler Tests

on:
  push:
    branches:
      - main
      - agent/**
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Install package
        run: python -m pip install -e .

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Check capability example
        run: python -m koschei check examples/capability.ks

      - name: Check runtime demo
        run: python -m koschei check examples/runtime_demo.ks

      - name: Run runtime demo
        run: python -m koschei run examples/runtime_demo.ks

      - name: Check control flow example
        run: python -m koschei check examples/control_flow.ks

      - name: Run control flow example
        run: |
          output="$(python -m koschei run examples/control_flow.ks)"
          test "$output" = $'3\n2\n1\nKoschei control flow: PASS'

      - name: Build native binary
        run: python -m koschei build examples/hello.ks -o /tmp/koschei-hello

      - name: Native binary matches interpreter
        run: |
          native="$(/tmp/koschei-hello)"
          interpreted="$(python -m koschei run examples/hello.ks)"
          test "$native" = "$interpreted"

      - name: Native capability runtime matches interpreter
        run: |
          python -m koschei build examples/runtime_demo.ks -o /tmp/koschei-runtime
          native="$(KOSCHEI_RUNTIME_NAME=Native /tmp/koschei-runtime)"
          interpreted="$(KOSCHEI_RUNTIME_NAME=Native python -m koschei run examples/runtime_demo.ks)"
          test "$native" = "$interpreted"
          case "$native" in
            *"Merhaba Native"*) ;;
            *) echo "HATA: native capability runtime beklenen env çıktısını vermedi" >&2; exit 1 ;;
          esac

      - name: Validate v0.9 diagnostics and project tools
        shell: bash
        run: |
          set -euo pipefail
          python -m koschei version | grep -F "Koschei 0.9.0"
          python -m koschei check --json examples/hello.ks \
            | python -c 'import json,sys; data=json.load(sys.stdin); assert data["ok"] and data["modules"] == 1'
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          python -m koschei new ci-project --path "$tmp/ci-project"
          python -m koschei check --json "$tmp/ci-project" \
            | python -c 'import json,sys; assert json.load(sys.stdin)["ok"]'
          python -m koschei run "$tmp/ci-project" | grep -F "Hello from ci-project"
          python -m koschei build "$tmp/ci-project" -o "$tmp/app"
          test "$("$tmp/app")" = "Hello from ci-project"

      - name: Validate VS Code extension
        shell: bash
        run: |
          set -euo pipefail
          node --check editors/vscode/extension.js
          python -c 'import json; from pathlib import Path; [json.loads(Path(p).read_text(encoding="utf-8")) for p in ("editors/vscode/package.json", "editors/vscode/language-configuration.json", "editors/vscode/syntaxes/koschei.tmLanguage.json")]'

      - name: Capability manifest for showcase
        run: python -m koschei caps examples/showcase.ks

      - name: Pure example requests no capabilities
        run: python -m koschei caps examples/hello.ks --deny disk --deny net --deny env --deny process

      - name: Policy gate rejects undeclared network access
        run: |
          if python -m koschei caps examples/showcase.ks --deny net; then
            echo "HATA: politika kapısı ağ talebini reddetmeliydi" >&2
            exit 1
          fi

      - name: Examples stay canonically formatted
        run: |
          for file in examples/*.ks; do
            python -m koschei fmt --check "$file"
          done

      - name: Run v0.7 daily-programming example
        run: |
          output="$(python -m koschei run examples/daily.ks)"
          case "$output" in
            *"Kişi sayısı: 3"*) ;;
            *) echo "HATA: v0.7 günlük program örneği beklenen çıktıyı vermedi" >&2; exit 1 ;;
          esac

      - name: Run v0.8 algebraic-type example
        run: |
          output="$(python -m koschei run examples/v08_types.ks)"
          test "$output" = $'Gönderildi: Onur\nişlem başarısız'

      - name: Native v0.8 algebraic types match interpreter
        run: |
          python -m koschei build examples/v08_types.ks -o /tmp/koschei-v08-types
          native="$(/tmp/koschei-v08-types)"
          interpreted="$(python -m koschei run examples/v08_types.ks)"
          test "$native" = "$interpreted"

      - name: Native v0.8 daily collections match interpreter
        run: |
          python -m koschei build examples/daily.ks -o /tmp/koschei-daily
          native="$(/tmp/koschei-daily)"
          interpreted="$(python -m koschei run examples/daily.ks)"
          test "$native" = "$interpreted"

      - name: Native v0.8 maps match interpreter
        run: |
          python -m koschei build examples/maps.ks -o /tmp/koschei-maps
          native="$(/tmp/koschei-maps)"
          interpreted="$(python -m koschei run examples/maps.ks)"
          test "$native" = "$interpreted"

      - name: Native v0.8 structs match interpreter
        run: |
          python -m koschei build examples/holders.ks -o /tmp/koschei-holders
          native="$(/tmp/koschei-holders)"
          interpreted="$(python -m koschei run examples/holders.ks)"
          test "$native" = "$interpreted"

      - name: Native v0.8 modules match interpreter
        run: |
          python -m koschei build examples/app.ks -o /tmp/koschei-app
          native="$(/tmp/koschei-app)"
          interpreted="$(python -m koschei run examples/app.ks)"
          test "$native" = "$interpreted"

      - name: Run data-structure example
        run: |
          output="$(python -m koschei run examples/holders.ks)"
          case "$output" in
            *KRITIK*) ;;
            *) echo "HATA: holders örneği beklenen çıktıyı vermedi" >&2; exit 1 ;;
          esac

      - name: Multi-file program runs
        run: |
          output="$(python -m koschei run examples/app.ks)"
          case "$output" in
            *KRITIK*) ;;
            *) echo "HATA: app örneği beklenen çıktıyı vermedi" >&2; exit 1 ;;
          esac

      - name: Supply-chain attack still does not compile
        run: |
          if python -m koschei check examples/supply_chain/main.ks; then
            echo "HATA: yetkisiz modül derlenmemeliydi" >&2
            exit 1
          fi

      - name: Module examples stay canonically formatted
        run: |
          python -m koschei fmt --check examples/app.ks
          python -m koschei fmt --check examples/risk.ks
          python -m koschei fmt --check examples/supply_chain/main.ks
          python -m koschei fmt --check examples/supply_chain/analytics.ks

      - name: Bootstrap static resource contracts once
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/v5-resource-contracts'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin agent/v5-resource-contracts main
          git checkout -B agent/v5-resource-contracts origin/agent/v5-resource-contracts
          if [[ ! -f tools/v5-resource-contracts.patch ]]; then
            echo "Resource bootstrap already completed."
            exit 0
          fi

          python - <<'PY'
          from pathlib import Path

          path = Path("tools/v5-resource-contracts.patch")
          text = path.read_text(encoding="utf-8")
          old = '''            _resource_contract(
                  declaration.name,
                  effect_contracts[declaration.name][0],
                  lower_function_blocks(declaration, typed_report),
              ),
              declaration,
              lower_function_blocks(declaration, typed_report),
          )
          for declaration in module.program.declarations
'''
          new = '''            _resource_contract(
                  declaration.name,
                  effect_contracts[declaration.name][0],
                  blocks,
              ),
              declaration,
              blocks,
          )
          for declaration in module.program.declarations
          for blocks in (lower_function_blocks(declaration, typed_report),)
'''
          if old not in text:
              raise SystemExit("resource patch lower-once guard did not match")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY

          git apply --check tools/v5-resource-contracts.patch
          git apply tools/v5-resource-contracts.patch
          python -m pip install -e .
          python -m unittest discover -s tests -q

          test "$(ks run examples/resource_contracts.ks)" = "resource contract ready"
          ks mir examples/resource_contracts.ks > /tmp/resource-mir.json
          python - <<'PY'
          import json
          with open('/tmp/resource-mir.json', encoding='utf-8') as handle:
              data = json.load(handle)
          assert data['version'] == 3
          functions = {item['name']: item for item in data['modules'][0]['functions']}
          assert functions['countdown']['resources']['self_recursive'] is True
          assert functions['main']['resources']['backward_edges'] > 0
          assert functions['main']['resources']['instructions'] > 0
          PY

          python - <<'PY'
          from dataclasses import replace
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from koschei.mir import MirIntegrityError, require_mir
          from koschei.modules import check_graph, load_graph

          source = Path('examples/resource_contracts.ks').read_text(encoding='utf-8')
          with TemporaryDirectory() as directory:
              path = Path(directory) / 'main.ks'
              path.write_text(source, encoding='utf-8')
              graph = load_graph(path)
              check_graph(graph)
              mir = require_mir(graph)
              module = mir.root_module
              function = module.functions[0]
              forged_resources = replace(function.resources, instructions=999999)
              forged_function = replace(function, resources=forged_resources)
              forged_module = replace(module, functions=(forged_function,) + module.functions[1:])
              modules = dict(mir.modules)
              modules[mir.root] = forged_module
              attack = replace(mir, modules=modules)
              try:
                  attack.assert_sealed()
              except MirIntegrityError as error:
                  assert error.code == 'KS5002'
              else:
                  raise SystemExit('forged resource contract was accepted')
          PY

          if ks check examples/supply_chain/main.ks > /tmp/resource-attack.out 2>&1; then
            echo "Supply-chain attack unexpectedly compiled" >&2
            exit 1
          fi
          grep -q KS2401 /tmp/resource-attack.out

          git rm .github/workflows/v5-resource-snapshot.yml tools/v5-resource-contracts.patch
          git checkout origin/main -- .github/workflows/tests.yml .github/workflows/verify.yml
          git config user.name 'Koschei CI'
          git config user.email 'actions@users.noreply.github.com'
          git add koschei/mir.py tests/test_resource_contracts_v5.py examples/resource_contracts.ks
          git commit -m 'v5: seal static resource contracts in MIR'
          git push origin HEAD:agent/v5-resource-contracts
