name: Koschei Compiler Tests

# GitHub-hosted Actions are bootstrap validation evidence, not language authority.
# The canonical semantic authority remains the sealed Koschei compiler/runtime
# contract. This workflow automatically executes the canonical full validator so
# every candidate head has reproducible executable evidence.
on:
  push:
    branches:
      - production/runtime-variant-parity-v1
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Match the current production Docker toolchain. `native/go.mod`
          # remains the language/module floor, not the acquisition build pin.
          go-version: "1.24"

      - name: Install package and local validator dependency
        run: |
          python -m pip install -e . pytest
          # Editable installation creates local build metadata. The validator
          # requires the candidate checkout itself to remain byte-clean.
          git clean -fdx

      - name: Bind bootstrap metadata to exact commit
        run: |
          mkdir -p /tmp/koschei-bootstrap-metadata
          git rev-parse HEAD > /tmp/koschei-bootstrap-metadata/candidate-commit.txt
          python --version > /tmp/koschei-bootstrap-metadata/python-version.txt 2>&1
          go version > /tmp/koschei-bootstrap-metadata/go-version.txt 2>&1

      - name: Run canonical full validation recipe
        run: |
          python -m koschei.local_validation_cli \
            --profile full \
            --output /tmp/koschei-local-validation.json \
            --evidence-dir /tmp/koschei-validation-evidence

      - name: Hash validation receipt
        if: always()
        run: |
          if [ -f /tmp/koschei-local-validation.json ]; then
            sha256sum /tmp/koschei-local-validation.json > /tmp/koschei-bootstrap-metadata/validation-receipt.sha256
          fi

      - name: Upload sealed validation receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: koschei-local-validation-${{ github.sha }}
          path: |
            /tmp/koschei-local-validation.json
            /tmp/koschei-validation-evidence
            /tmp/koschei-bootstrap-metadata
          if-no-files-found: warn
