name: V5 MIR Foundation Bootstrap

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/v5-mir-foundation'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: agent/v5-mir-foundation
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Apply and validate sealed MIR foundation once
        shell: bash
        run: |
          set -euo pipefail
          if test -f tests/test_mir_v5.py; then
            echo 'sealed MIR implementation already committed'
            exit 0
          fi
          base64 -d tools/v5-mir-foundation.patch.gz.b64 | gzip -d > /tmp/v5-mir-foundation.patch
          echo 'ce7e3d32f4a7317d75fc39935a31ab3098931e488df49aa474a3842bf704a875  /tmp/v5-mir-foundation.patch' | sha256sum -c -
          git apply --check /tmp/v5-mir-foundation.patch
          git apply /tmp/v5-mir-foundation.patch
          python -m pip install -e .
          python -m py_compile koschei/*.py tests/test_mir_v5.py
          python -m unittest discover -s tests -q
          python -m koschei mir examples/hello.ks | python -c 'import json,sys; p=json.load(sys.stdin); assert p["version"] == 1 and len(p["fingerprint"]) == 64'
          python -m koschei build examples/hello.ks -o /tmp/koschei-mir-hello
          test "$(/tmp/koschei-mir-hello)" = "$(python -m koschei run examples/hello.ks)"
          git config user.name 'Koschei CI'
          git config user.email 'actions@users.noreply.github.com'
          git add CHANGELOG.md README.md README.tr.md design/v5-usage-guide.md docs/mir-v5.md docs/v5-roadmap.md koschei/cli.py koschei/codegen_go.py koschei/interpreter.py koschei/mir.py koschei/modules.py tests/test_mir_v5.py verify.sh
          git commit -m 'v5: add sealed MIR foundation'
          git push origin HEAD:agent/v5-mir-foundation
