name: V5 MIR Source Snapshot

on:
  pull_request:

permissions:
  contents: read

jobs:
  snapshot:
    if: github.event.pull_request.head.ref == 'agent/v5-mir-foundation'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: agent/v5-mir-foundation

      - name: Upload exact source tree
        uses: actions/upload-artifact@v4
        with:
          name: koschei-mir-source-snapshot
          path: |
            .
            !.git
          include-hidden-files: true
          if-no-files-found: error
