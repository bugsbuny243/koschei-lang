name: Apply v0.8 alpha 4 native collections

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/v0.8-alpha4-native-collections'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/v0.8-alpha4-native-collections
          fetch-depth: 0

      - name: Apply verified alpha 4 patch
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .github/v0.8-alpha4.patch.gz.b64 | gzip --decompress > /tmp/v0.8-alpha4.patch
          actual="$(sha256sum /tmp/v0.8-alpha4.patch | cut -d' ' -f1)"
          test "$actual" = "4f62cb1bc25bf8d001541614856901498568af7d2d84881194ad61b7818e4409"
          git apply --check /tmp/v0.8-alpha4.patch
          git apply /tmp/v0.8-alpha4.patch
          rm .github/v0.8-alpha4.patch.gz.b64
          rm .github/workflows/apply-v0.8-alpha4.yml
          git diff --check

      - name: Run full test suite
        run: python -m unittest discover -s tests -v

      - name: Validate examples
        shell: bash
        run: |
          set -euo pipefail
          for file in examples/*.ks; do
            python -m koschei check "$file"
            python -m koschei fmt --check "$file"
          done

      - name: Validate native collections parity
        shell: bash
        run: |
          set -euo pipefail
          python -m koschei build examples/daily.ks -o /tmp/koschei-daily
          test "$(/tmp/koschei-daily)" = "$(python -m koschei run examples/daily.ks)"
          python -m koschei build examples/maps.ks -o /tmp/koschei-maps
          test "$(/tmp/koschei-maps)" = "$(python -m koschei run examples/maps.ks)"

      - name: Build alpha wheel
        run: python -m pip wheel . --no-deps --no-build-isolation -w /tmp/wheel

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build dist koschei_lang.egg-info
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "v0.8 alpha 4: native immutable collections"
          git push origin HEAD:agent/v0.8-alpha4-native-collections
