name: Koschei Adversarial Lab

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adversarial-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run adversarial release gates
        run: |
          python tools/run_adversarial_lab.py --candidate "${GITHUB_SHA}" --json-out adversarial-lab-report.json
      - name: Upload adversarial report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: koschei-adversarial-lab-report
          path: adversarial-lab-report.json
          if-no-files-found: error
