name: Koschei Adversarial Lab

# GitHub-hosted Actions are intentionally not an automatic Koschei authority.
# The Free-plan allowance is unavailable for this repository. The canonical
# path is `ks-local-validate --profile full`; this workflow is retained only as
# a manual fallback recipe for a future runner.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adversarial-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install package and adversarial test runner
        run: python -m pip install -e . pytest

      - name: Run adversarial release gates
        run: |
          python tools/run_adversarial_lab.py --candidate "${GITHUB_SHA}" --json-out adversarial-lab-report.json

      - name: Upload adversarial report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: koschei-adversarial-lab-report
          path: adversarial-lab-report.json
          if-no-files-found: error
