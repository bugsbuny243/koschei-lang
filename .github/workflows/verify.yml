name: Koschei Repository Truth

# Automatic GitHub-hosted CI is disabled. The canonical validation path is the
# sealed `ks-local-validate --profile full` run executed outside the checkout.
# This workflow is kept only as a manual fallback recipe.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Install package
        run: python -m pip install -e . pytest

      - name: Validate release gate syntax
        run: bash -n verify.sh

      - name: Verify repository claims
        run: bash verify.sh
