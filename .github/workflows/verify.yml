name: Koschei Repository Truth

on:
  push:
    branches:
      - main
      - agent/**
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Install package
        run: python -m pip install -e .

      - name: Validate release gate syntax
        run: bash -n verify.sh

      - name: Verify repository claims
        id: verify
        shell: bash
        run: |
          set +e
          bash verify.sh > verify-report.txt 2>&1
          status=$?
          cat verify-report.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: koschei-verify-report
          path: verify-report.txt
          if-no-files-found: error

      - name: Enforce verification result
        shell: bash
        run: test "${{ steps.verify.outputs.status }}" = "0"
