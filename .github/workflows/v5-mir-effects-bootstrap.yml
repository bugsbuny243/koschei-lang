name: V5 MIR Effects Bootstrap

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/v5-mir-effects' && github.event.pull_request.draft == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v5-mir-effects
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: Apply effect-aware MIR changes once
        shell: bash
        run: |
          set -euo pipefail
          test ! -f koschei/effects.py || exit 0
          cat > koschei/effects.py <<'PY'
          """Fail-closed capability/effect inference for sealed MIR."""
          from __future__ import annotations

          from dataclasses import fields, is_dataclass
          from typing import Any

          from .ast_nodes import CallExpression, FunctionDeclaration, Identifier, MemberExpression, Program

          _METHOD_EFFECTS = {
              "NetCaps": {"get": "net", "post": "net", "put": "net", "delete": "net", "request": "net"},
              "DiskReadCaps": {"read": "disk.read", "read_file": "disk.read", "list": "disk.read"},
              "DiskCaps": {"read": "disk.read", "read_file": "disk.read", "list": "disk.read", "write": "disk.write", "write_file": "disk.write", "delete": "disk.write"},
              "EnvCaps": {"get": "env.read"},
              "ProcessCaps": {"run": "process", "spawn": "process"},
          }

          def _walk(value: Any):
              if is_dataclass(value):
                  yield value
                  for field in fields(value):
                      yield from _walk(getattr(value, field.name))
              elif isinstance(value, (tuple, list)):
                  for item in value:
                      yield from _walk(item)
              elif isinstance(value, dict):
                  for item in value.values():
                      yield from _walk(item)

          def _direct(function: FunctionDeclaration, local_names: set[str]) -> tuple[set[str], set[str]]:
              parameter_types = {parameter.name: str(parameter.type_ref) for parameter in function.parameters}
              effects: set[str] = set()
              calls: set[str] = set()
              for node in _walk(function.body):
                  if not isinstance(node, CallExpression):
                      continue
                  if isinstance(node.callee, Identifier) and node.callee.name in local_names:
                      calls.add(node.callee.name)
                  if not isinstance(node.callee, MemberExpression):
                      continue
                  receiver = node.callee.object
                  if not isinstance(receiver, Identifier):
                      continue
                  effect = _METHOD_EFFECTS.get(parameter_types.get(receiver.name, ""), {}).get(node.callee.member)
                  if effect is not None:
                      effects.add(effect)
              return effects, calls

          def infer_effects(program: Program) -> dict[str, tuple[tuple[str, ...], tuple[str, ...]]]:
              names = {function.name for function in program.declarations}
              direct: dict[str, set[str]] = {}
              calls: dict[str, set[str]] = {}
              for function in program.declarations:
                  direct[function.name], calls[function.name] = _direct(function, names)
              resolved = {name: set(items) for name, items in direct.items()}
              changed = True
              while changed:
                  changed = False
                  for name, callees in calls.items():
                      expanded = resolved[name] | set().union(*(resolved[callee] for callee in callees)) if callees else resolved[name]
                      if expanded != resolved[name]:
                          resolved[name] = expanded
                          changed = True
              return {
                  name: (tuple(sorted(calls[name])), tuple(sorted(resolved[name])))
                  for name in sorted(names)
              }
          PY

          python - <<'PY'
          from pathlib import Path
          path = Path('koschei/mir.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('from .diagnostics import CATALOG, ENGLISH_CATALOG, Diagnostic\n', 'from .diagnostics import CATALOG, ENGLISH_CATALOG, Diagnostic\nfrom .effects import infer_effects\n')
          text = text.replace('MIR_VERSION = 2', 'MIR_VERSION = 3')
          text = text.replace('    return_type: TypeNode\n    declaration: FunctionDeclaration\n', '    return_type: TypeNode\n    calls: tuple[str, ...]\n    effects: tuple[str, ...]\n    declaration: FunctionDeclaration\n')
          text = text.replace('                for function in module.functions:\n                    validate_blocks(function.blocks)\n', '                for function in module.functions:\n                    validate_blocks(function.blocks)\n                expected_effects = infer_effects(module.program)\n                for function in module.functions:\n                    expected_calls, expected = expected_effects[function.name]\n                    if function.calls != expected_calls or function.effects != expected:\n                        raise ValueError(f"effect contract mismatch for {module.name}.{function.name}")\n')
          text = text.replace('                "return": render_type(function.return_type),\n                "blocks":', '                "return": render_type(function.return_type),\n                "calls": list(function.calls),\n                "effects": list(function.effects),\n                "blocks":')
          old = '''def lower_module(module: Any, typed_report: TypedHIRReport) -> MirModule:\n    functions = tuple(\n        MirFunction(\n            declaration.name,\n            tuple(\n                MirParameter(\n                    parameter.name,\n                    function_type(declaration, parameter.type_ref),\n                )\n                for parameter in declaration.parameters\n            ),\n            function_type(declaration, declaration.return_type),\n            declaration,\n            lower_function_blocks(declaration, typed_report),\n        )\n        for declaration in module.program.declarations\n    )\n'''
          new = '''def lower_module(module: Any, typed_report: TypedHIRReport) -> MirModule:\n    effect_contracts = infer_effects(module.program)\n    functions = tuple(\n        MirFunction(\n            declaration.name,\n            tuple(\n                MirParameter(\n                    parameter.name,\n                    function_type(declaration, parameter.type_ref),\n                )\n                for parameter in declaration.parameters\n            ),\n            function_type(declaration, declaration.return_type),\n            effect_contracts[declaration.name][0],\n            effect_contracts[declaration.name][1],\n            declaration,\n            lower_function_blocks(declaration, typed_report),\n        )\n        for declaration in module.program.declarations\n    )\n'''
          if old not in text:
              raise SystemExit('lower_module pattern not found')
          text = text.replace(old, new)
          text = text.replace('                        "return": render_type(function.return_type),\n                        "blocks":', '                        "return": render_type(function.return_type),\n                        "calls": list(function.calls),\n                        "effects": list(function.effects),\n                        "blocks":')
          path.write_text(text, encoding='utf-8')
          PY

          cat > tests/test_mir_effects_v5.py <<'PY'
          from dataclasses import replace
          import json
          from pathlib import Path
          import tempfile
          import unittest

          from koschei.mir import MirIntegrityError, require_mir, to_dict
          from koschei.modules import check_graph, load_graph

          class MirEffectTests(unittest.TestCase):
              def mir_for(self, source: str):
                  directory = tempfile.TemporaryDirectory()
                  path = Path(directory.name) / 'main.ks'
                  path.write_text(source, encoding='utf-8')
                  graph = load_graph(path)
                  check_graph(graph)
                  return directory, require_mir(graph)

              def test_direct_and_transitive_effects_are_inferred(self):
                  source = '''
          fn read_config(disk: DiskReadCaps, path: String) -> String or Error {
              return disk.read(path) or return Error("read")
          }
          fn load(disk: DiskReadCaps, path: String) -> String or Error {
              return read_config(disk, path) or return Error("load")
          }
          fn main() { println("ready") }
          '''
                  directory, mir = self.mir_for(source)
                  try:
                      functions = {item.name: item for item in mir.root_module.functions}
                      self.assertEqual(functions['read_config'].effects, ('disk.read',))
                      self.assertEqual(functions['load'].calls, ('read_config',))
                      self.assertEqual(functions['load'].effects, ('disk.read',))
                      self.assertEqual(functions['main'].effects, ())
                  finally:
                      directory.cleanup()

              def test_write_and_network_effects_are_distinct(self):
                  source = '''
          fn save(disk: DiskCaps, path: String, value: String) -> Void { disk.write(path, value) or return }
          fn fetch(net: NetCaps, url: String) -> String or Error { let r = net.get(url) or return Error("net") return r.text() }
          fn main() { println("ok") }
          '''
                  directory, mir = self.mir_for(source)
                  try:
                      functions = {item.name: item for item in mir.root_module.functions}
                      self.assertEqual(functions['save'].effects, ('disk.write',))
                      self.assertEqual(functions['fetch'].effects, ('net',))
                  finally:
                      directory.cleanup()

              def test_effects_are_visible_in_json(self):
                  source = '''
          fn inspect(env: EnvCaps) -> String or Error { return env.get("TOKEN") or return Error("missing") }
          fn main() { println("safe") }
          '''
                  directory, mir = self.mir_for(source)
                  try:
                      payload = to_dict(mir)
                      inspect = next(item for item in payload['modules'][0]['functions'] if item['name'] == 'inspect')
                      self.assertEqual(inspect['effects'], ['env.read'])
                      self.assertEqual(payload['version'], 3)
                  finally:
                      directory.cleanup()

              def test_forged_effect_metadata_breaks_seal(self):
                  directory, mir = self.mir_for('fn main() { println("safe") }\n')
                  try:
                      root = mir.root_module
                      forged_function = replace(root.functions[0], effects=('net',))
                      forged_root = replace(root, functions=(forged_function,))
                      forged_modules = dict(mir.modules)
                      forged_modules[mir.root] = forged_root
                      forged = replace(mir, modules=forged_modules)
                      with self.assertRaises(MirIntegrityError):
                          forged.assert_sealed()
                  finally:
                      directory.cleanup()

              def test_recursive_call_graph_reaches_fixpoint(self):
                  source = '''
          fn a(disk: DiskReadCaps) -> String or Error { return b(disk) or return Error("a") }
          fn b(disk: DiskReadCaps) -> String or Error { if true { return disk.read("x") or return Error("b") } return a(disk) }
          fn main() { println("cycle") }
          '''
                  directory, mir = self.mir_for(source)
                  try:
                      functions = {item.name: item for item in mir.root_module.functions}
                      self.assertEqual(functions['a'].effects, ('disk.read',))
                      self.assertEqual(functions['b'].effects, ('disk.read',))
                  finally:
                      directory.cleanup()

          if __name__ == '__main__':
              unittest.main()
          PY

          cat > examples/mir_effects_project.ks <<'KS'
          fn read_config(disk: DiskReadCaps, path: String) -> String or Error {
              return disk.read(path) or return Error("cannot read")
          }

          fn load_config(disk: DiskReadCaps, path: String) -> String or Error {
              return read_config(disk, path) or return Error("cannot load")
          }

          fn main() {
              println("effect graph ready")
          }
          KS

          python -m pip install -e .
          python -m unittest discover -s tests -q
          ks check examples/mir_effects_project.ks
          test "$(ks run examples/mir_effects_project.ks)" = "effect graph ready"
          ks mir examples/mir_effects_project.ks > /tmp/mir-effects.json
          python - <<'PY'
          import json
          payload=json.load(open('/tmp/mir-effects.json'))
          functions={f['name']:f for f in payload['modules'][-1]['functions']}
          assert payload['version'] == 3
          assert functions['read_config']['effects'] == ['disk.read']
          assert functions['load_config']['effects'] == ['disk.read']
          PY
          if ks check examples/supply_chain/main.ks >/tmp/attack.out 2>&1; then
            echo 'supply-chain attack unexpectedly compiled' >&2; exit 1
          fi
          grep -q KS2401 /tmp/attack.out
          git config user.name 'Koschei CI'
          git config user.email 'actions@users.noreply.github.com'
          git add koschei/effects.py koschei/mir.py tests/test_mir_effects_v5.py examples/mir_effects_project.ks
          git commit -m 'v5: seal transitive capability effects in MIR'
          git push origin HEAD:agent/v5-mir-effects
