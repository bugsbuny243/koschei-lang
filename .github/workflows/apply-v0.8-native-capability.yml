name: Apply v0.8 native capability ABI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/v0.8-native-capability'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/v0.8-native-capability
          fetch-depth: 0

      - name: Apply verified native capability patch
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .github/v08a2-native.patch.gz.b64 \
            | gzip --decompress > /tmp/v08a2-native.patch
          actual="$(sha256sum /tmp/v08a2-native.patch | cut -d' ' -f1)"
          test "$actual" = "f515d83c9a72721618f9cceae52e58c2d5d86b44cc28d69c8e27ad55b3de5dc6"
          git apply --check /tmp/v08a2-native.patch
          git apply /tmp/v08a2-native.patch

          # Permanent CI is written afterward through the authenticated GitHub
          # connector; Actions tokens must not push workflow-file changes.
          git checkout HEAD -- .github/workflows/tests.yml

          rm .github/v08a2-native.patch.gz.b64
          rm .github/workflows/apply-v0.8-native-capability.yml
          git diff --check

      - name: Run full test suite
        run: python -m unittest discover -s tests -v

      - name: Validate examples
        shell: bash
        run: |
          set -euo pipefail
          for file in examples/*.ks; do
            python -m koschei check "$file"
            python -m koschei fmt --check "$file"
          done

      - name: Validate native capability parity
        shell: bash
        run: |
          set -euo pipefail
          python -m koschei build examples/runtime_demo.ks -o /tmp/koschei-runtime
          native="$(KOSCHEI_RUNTIME_NAME=Native /tmp/koschei-runtime)"
          interpreted="$(KOSCHEI_RUNTIME_NAME=Native python -m koschei run examples/runtime_demo.ks)"
          test "$native" = "$interpreted"
          case "$native" in
            *"Merhaba Native"*) ;;
            *) echo "native capability runtime failed" >&2; exit 1 ;;
          esac

      - name: Build alpha wheel
        run: python -m pip wheel . --no-deps --no-build-isolation -w /tmp/wheel

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build *.egg-info
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "v0.8 alpha 2: add native capability runtime ABI"
          git push origin HEAD:agent/v0.8-native-capability
