name: Apply v0.8 algebraic type core

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/v0.8-types'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/v0.8-types
          fetch-depth: 0

      - name: Apply verified v0.8 patch
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .github/v08-types-patch-00 \
            .github/v08-types-patch-01 \
            .github/v08-types-patch-02 \
            .github/v08-types-patch-03 > /tmp/v08-types.b64
          base64 --decode /tmp/v08-types.b64 \
            | gzip --decompress > /tmp/v08-types.patch
          actual="$(sha256sum /tmp/v08-types.patch | cut -d' ' -f1)"
          test "$actual" = "b1330548f567b2a00de64684a3eb95edf5bcd1b79829c6bfc69133de1f023daa"
          git apply --check /tmp/v08-types.patch
          git apply /tmp/v08-types.patch

          # Permanent CI is written afterward through the authenticated GitHub
          # connector. Actions tokens must not push workflow-file changes.
          git checkout HEAD -- .github/workflows/tests.yml

          rm -f \
            .github/v08-types-patch-00 \
            .github/v08-types-patch-01 \
            .github/v08-types-patch-02 \
            .github/v08-types-patch-03 \
            .github/workflows/apply-v0.8-types.yml
          git diff --check

      - name: Run test suite
        run: python -m unittest discover -s tests -v

      - name: Validate examples
        shell: bash
        run: |
          set -euo pipefail
          for file in examples/*.ks; do
            python -m koschei check "$file"
            python -m koschei fmt --check "$file"
          done
          output="$(python -m koschei run examples/v08_types.ks)"
          test "$output" = $'Gönderildi: Onur\nişlem başarısız'

      - name: Validate existing native backend
        shell: bash
        run: |
          set -euo pipefail
          python -m koschei build examples/hello.ks -o /tmp/koschei-hello
          native="$(/tmp/koschei-hello)"
          interpreted="$(python -m koschei run examples/hello.ks)"
          test "$native" = "$interpreted"

      - name: Build alpha wheel
        run: python -m pip wheel . --no-deps --no-build-isolation -w /tmp/wheel

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build *.egg-info
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "v0.8 alpha 1: add algebraic type core"
          git push origin HEAD:agent/v0.8-types
