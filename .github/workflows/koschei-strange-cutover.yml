name: Koschei Strange Cutover Native Gate

on:
  pull_request:
    paths:
      - 'koschei/strange_cutover_orchestrator_v1.py'
      - 'koschei/strange_*_v1.py'
      - 'tests/test_strange_cutover_orchestrator*_v1.py'
      - '.github/workflows/koschei-strange-cutover.yml'
  push:
    branches:
      - main
    paths:
      - 'koschei/strange_cutover_orchestrator_v1.py'
      - 'koschei/strange_*_v1.py'
      - 'tests/test_strange_cutover_orchestrator*_v1.py'
      - '.github/workflows/koschei-strange-cutover.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: strange-cutover-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-cutover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up pinned Go toolchain channel
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Install Koschei sources without optional network dependencies
        run: python -m pip install -e . --no-deps
      - name: Verify mocked-boundary denials and REAL Linux native cutover
        env:
          GOTOOLCHAIN: local
        run: |
          python -m unittest discover -s tests             -p 'test_strange_cutover_orchestrator*_v1.py' -v
      - name: Record toolchain and exact source identity
        if: always()
        run: |
          mkdir -p /tmp/koschei-strange-evidence
          git rev-parse HEAD > /tmp/koschei-strange-evidence/commit.txt
          python --version > /tmp/koschei-strange-evidence/python.txt 2>&1
          go version > /tmp/koschei-strange-evidence/go.txt 2>&1
          sha256sum "$(command -v go)" > /tmp/koschei-strange-evidence/go-executable.sha256
      - name: Upload exact-head bootstrap evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: koschei-strange-cutover-${{ github.sha }}
          path: /tmp/koschei-strange-evidence
          if-no-files-found: warn
