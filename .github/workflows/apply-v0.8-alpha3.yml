name: Apply v0.8 alpha 3 native ADT

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/v0.8-alpha3-native-adt'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/v0.8-alpha3-native-adt
          fetch-depth: 0

      - name: Apply verified alpha 3 patch
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .github/v0.8-alpha3.patch.gz.b64 | gzip --decompress > /tmp/v0.8-alpha3.patch
          actual="$(sha256sum /tmp/v0.8-alpha3.patch | cut -d' ' -f1)"
          test "$actual" = "fd48281d9310958c685cad4859cdd265153019a8d542045b4273bfd76112d22c"
          git apply --check /tmp/v0.8-alpha3.patch
          git apply /tmp/v0.8-alpha3.patch
          rm .github/v0.8-alpha3.patch.gz.b64
          rm .github/workflows/apply-v0.8-alpha3.yml
          git diff --check

      - name: Run full test suite
        run: python -m unittest discover -s tests -v

      - name: Validate examples
        shell: bash
        run: |
          set -euo pipefail
          for file in examples/*.ks; do
            python -m koschei check "$file"
            python -m koschei fmt --check "$file"
          done

      - name: Validate native algebraic parity
        shell: bash
        run: |
          set -euo pipefail
          python -m koschei build examples/v08_types.ks -o /tmp/koschei-v08-types
          native="$(/tmp/koschei-v08-types)"
          interpreted="$(python -m koschei run examples/v08_types.ks)"
          test "$native" = "$interpreted"

      - name: Build alpha wheel
        run: python -m pip wheel . --no-deps --no-build-isolation -w /tmp/wheel

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build dist koschei_lang.egg-info
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "v0.8 alpha 3: native algebraic type parity"
          git push origin HEAD:agent/v0.8-alpha3-native-adt
