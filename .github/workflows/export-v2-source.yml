name: Export v2 source

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize

permissions:
  contents: read

jobs:
  export:
    if: github.head_ref == 'agent/v2-foundation'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v2 branch
        uses: actions/checkout@v4

      - name: Package source
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude=.git --exclude=.github/workflows/export-v2-source.yml \
            -czf /tmp/koschei-v2-source.tar.gz .

      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: koschei-v2-source
          path: /tmp/koschei-v2-source.tar.gz
          if-no-files-found: error
          retention-days: 1
