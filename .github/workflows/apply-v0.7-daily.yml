name: Apply v0.7 daily programming patch

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/v0.7-daily-stdlib'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/v0.7-daily-stdlib
          fetch-depth: 0

      - name: Apply v0.7 patch
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .github/v0.7-daily.patch.gz.b64 \
            | gzip --decompress > /tmp/v0.7-daily.patch
          actual="$(sha256sum /tmp/v0.7-daily.patch | cut -d' ' -f1)"
          test "$actual" = "2aa8036c2bac0a098122b721ece9a33529635e785c8f027c81b1bfba815cf0eb"
          git apply --check /tmp/v0.7-daily.patch
          git apply /tmp/v0.7-daily.patch
          git checkout HEAD -- .github/workflows/tests.yml
          rm .github/v0.7-daily.patch.gz.b64
          rm .github/workflows/apply-v0.7-daily.yml
          git diff --check

      - name: Run test suite
        run: python -m unittest discover -s tests -v

      - name: Validate examples
        shell: bash
        run: |
          set -euo pipefail
          for file in examples/*.ks; do
            python -m koschei check "$file"
            python -m koschei fmt --check "$file"
          done
          output="$(python -m koschei run examples/daily.ks)"
          case "$output" in
            *"Kişi sayısı: 3"*) ;;
            *) echo "daily example failed" >&2; exit 1 ;;
          esac

      - name: Build wheel
        run: python -m pip wheel . --no-deps --no-build-isolation -w /tmp/wheel

      - name: Diagnose commit and push
        id: publish
        continue-on-error: true
        shell: bash
        run: |
          set +e
          exec > >(tee /tmp/v0.7-publish.log) 2>&1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git status --short
          git add -A
          git diff --cached --check
          status=$?
          if [ "$status" -eq 0 ]; then
            git commit -m "v0.7: complete daily programming features"
            status=$?
          fi
          if [ "$status" -eq 0 ]; then
            git push origin HEAD:agent/v0.7-daily-stdlib
            status=$?
          fi
          echo "exit_status=$status"
          exit "$status"

      - name: Upload publish diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v0.7-publish-diagnostics
          path: /tmp/v0.7-publish.log
          if-no-files-found: error
          retention-days: 1

      - name: Fail when publish failed
        if: steps.publish.outcome == 'failure'
        run: exit 1
