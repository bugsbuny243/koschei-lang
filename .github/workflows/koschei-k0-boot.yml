name: Koschei K0 Standalone UEFI Boot

on:
  pull_request:
    paths:
      - 'server/kernel/k0/**'
      - '.github/workflows/koschei-k0-boot.yml'
  push:
    branches:
      - main
      - 'staging/k0-*'
    paths:
      - 'server/kernel/k0/**'
      - '.github/workflows/koschei-k0-boot.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: koschei-k0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qemu-k0-boot:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
      - name: Install temporary build and emulator tools (not guest dependencies)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang lld qemu-system-x86 ovmf dosfstools mtools
      - name: Build genuine freestanding EFI release and test binaries
        run: |
          bash server/kernel/k0/build.sh /tmp/koschei-k0-evidence
          file /tmp/koschei-k0-evidence/*.efi /tmp/koschei-k0-evidence/BOOTX64.EFI
      - name: Fail-closed binary and transcript regression tests
        run: |
          python3 -m unittest discover -s server/kernel/k0 -p 'test_*.py' -v
      - name: Execute native C memory map adversarial tests
        run: |
          clang -std=c11 -O2 -Wall -Wextra -Werror \
            server/kernel/k0/test_memory_map.c -o /tmp/koschei-k0-evidence/memory-map-tests
          /tmp/koschei-k0-evidence/memory-map-tests
      - name: Execute bounded page ledger adversarial tests
        run: |
          clang -std=c11 -O2 -Wall -Wextra -Werror \
            server/kernel/k0/test_page_pool.c -o /tmp/koschei-k0-evidence/page-pool-tests
          /tmp/koschei-k0-evidence/page-pool-tests
      - name: Execute staging paging-entry contract negative tests (not MMU proof)
        run: |
          clang -std=c11 -O2 -Wall -Wextra -Werror \
            server/kernel/k0/test_paging_contract.c -o /tmp/koschei-k0-evidence/paging-contract-tests
          /tmp/koschei-k0-evidence/paging-contract-tests
      - name: Execute four-level paging data-model adversarial tests (not CR3 proof)
        run: |
          clang -std=c11 -O2 -Wall -Wextra -Werror \
            server/kernel/k0/test_paging_model.c -o /tmp/koschei-k0-evidence/paging-model-tests
          /tmp/koschei-k0-evidence/paging-model-tests
      - name: Test predicted page-fault and access-denial model (NOT CPU faults)
        run: |
          clang -std=c11 -O2 -Wall -Wextra -Werror \
            server/kernel/k0/test_paging_walk.c -o /tmp/koschei-k0-evidence/paging-walk-tests
          /tmp/koschei-k0-evidence/paging-walk-tests
      - name: Reject overbroad low identity execute windows (test-only model)
        run: |
          clang -std=c11 -O2 -Wall -Wextra -Werror \
            server/kernel/k0/test_identity_exec_nx_policy.c \
            -o /tmp/koschei-k0-evidence/identity-exec-nx-tests
          /tmp/koschei-k0-evidence/identity-exec-nx-tests
      - name: Validate fail-closed PE section W^X preflight (not active MMU)
        run: |
          clang -std=c11 -O2 -Wall -Wextra -Werror \
            server/kernel/k0/test_pe_section_wx.c \
            -o /tmp/koschei-k0-evidence/pe-section-wx-tests
          /tmp/koschei-k0-evidence/pe-section-wx-tests
      - name: Reject invalid firmware LoadedImage bounds and descriptor gaps
        run: |
          clang -std=c11 -O2 -Wall -Wextra -Werror \
            server/kernel/k0/test_loaded_image_preflight.c \
            -o /tmp/koschei-k0-evidence/loaded-image-bounds-tests
          /tmp/koschei-k0-evidence/loaded-image-bounds-tests
      - name: Validate test-only real image W^X activation preflight
        run: |
          clang -std=c11 -O2 -Wall -Wextra -Werror \
            server/kernel/k0/test_active_image_wx.c \
            -o /tmp/koschei-k0-evidence/active-image-wx-tests
          /tmp/koschei-k0-evidence/active-image-wx-tests
      - name: Fail closed on stack/PE/pool ownership and coarse identity holes
        run: |
          clang -std=c11 -O2 -Wall -Wextra -Werror \
            server/kernel/k0/test_identity_ownership.c \
            -o /tmp/koschei-k0-evidence/identity-ownership-tests
          /tmp/koschei-k0-evidence/identity-ownership-tests
      - name: Verify transactional 4KiB stack guard and PT permissions
        run: |
          clang -std=c11 -O2 -Wall -Wextra -Werror \
            server/kernel/k0/test_stack_guard_4k.c \
            -o /tmp/koschei-k0-evidence/stack-guard-4k-tests
          /tmp/koschei-k0-evidence/stack-guard-4k-tests
      - name: Deny unclaimed 4KiB physical pool page leaves (host adversarial)
        run: |
          clang -std=c11 -O2 -Wall -Wextra -Werror \
            server/kernel/k0/test_pool_4k.c \
            -o /tmp/koschei-k0-evidence/pool-4k-claimed-tests
          /tmp/koschei-k0-evidence/pool-4k-claimed-tests
      - name: Validate readonly 4KiB GDT ownership and PT construction
        run: |
          clang -std=c11 -O2 -Wall -Wextra -Werror \
            server/kernel/k0/test_gdt_4k.c \
            -o /tmp/koschei-k0-evidence/gdt-4k-ro-tests
          /tmp/koschei-k0-evidence/gdt-4k-ro-tests
      - name: Boot actual UEFI binary on QEMU OVMF and capture UART proof
        run: |
          bash server/kernel/k0/qemu_smoke.sh /tmp/koschei-k0-evidence
      - name: Prove own-CR3 supervisor RO write rejection in real QEMU (test-only)
        run: |
          bash server/kernel/k0/qemu_smoke.sh /tmp/koschei-k0-evidence ro
      - name: Prove own-CR3 NX execution rejection in real QEMU (test-only)
        run: |
          bash server/kernel/k0/qemu_smoke.sh /tmp/koschei-k0-evidence nx
      - name: Prove real own-CR3 high-half 4K write/read mapping in QEMU (test-only)
        run: |
          bash server/kernel/k0/qemu_smoke.sh /tmp/koschei-k0-evidence mapped
      - name: Prove real 4KiB PE .text write denial under CR0.WP in QEMU (test-only)
        run: |
          bash server/kernel/k0/qemu_smoke.sh /tmp/koschei-k0-evidence wx
      - name: Prove real 4KiB PE .bss instruction fetch denied in CPU (test-only)
        run: |
          bash server/kernel/k0/qemu_smoke.sh /tmp/koschei-k0-evidence data-nx
      - name: Prove real denied access to a non-owned low physical identity hole
        run: |
          bash server/kernel/k0/qemu_smoke.sh /tmp/koschei-k0-evidence low-hole
      - name: Prove real nonpresent stack 4KiB guard with CPU CR2/error/CR3
        run: |
          bash server/kernel/k0/qemu_smoke.sh /tmp/koschei-k0-evidence stack-guard
      - name: Prove real CPU denial of unclaimed physical pool page
        run: |
          bash server/kernel/k0/qemu_smoke.sh /tmp/koschei-k0-evidence pool-hole
      - name: Prove real supervisor write to firmware GDT denied by CPU CR0.WP
        run: |
          bash server/kernel/k0/qemu_smoke.sh /tmp/koschei-k0-evidence gdt-ro
      - name: Bind evidence to commit and toolchain
        if: always()
        run: |
          mkdir -p /tmp/koschei-k0-evidence
          git rev-parse HEAD > /tmp/koschei-k0-evidence/commit.txt
          clang --version > /tmp/koschei-k0-evidence/clang-version.txt
          qemu-system-x86_64 --version > /tmp/koschei-k0-evidence/qemu-version.txt
      - name: Upload standalone boot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: koschei-k0-uefi-${{ github.sha }}
          path: /tmp/koschei-k0-evidence/
          if-no-files-found: warn
