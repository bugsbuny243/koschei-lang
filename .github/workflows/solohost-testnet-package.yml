name: SoloHost Testnet Package

on:
  push:
    branches:
      - feature/solohost-sealed-release-v1
    paths:
      - 'koschei/**'
      - 'native/**'
      - 'examples/**'
      - 'tools/solohost_binary_entry_v1.py'
      - 'tools/build_solohost_binary_v1.py'
      - 'tools/smoke_solohost_binary_v1.py'
      - 'tools/assemble_solohost_staging_v1.py'
      - 'tools/sign_solohost_release_v1.py'
      - '.github/workflows/solohost-testnet-package.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux-x86_64:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - name: Install release builder
        run: python -m pip install --upgrade pip nuitka ordered-set zstandard
      - name: Build source-free executable
        run: python tools/build_solohost_binary_v1.py --mode onefile --output out/build
      - name: Locate executable
        id: binary
        shell: bash
        run: |
          BIN="$(find out/build -type f -name ks -perm -111 | head -n1)"
          test -n "$BIN"
          echo "path=$BIN" >> "$GITHUB_OUTPUT"
      - name: Full functional and native smoke gate
        run: python tools/smoke_solohost_binary_v1.py '${{ steps.binary.outputs.path }}' --require-native-build --receipt out/smoke.json
      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION="$('${{ steps.binary.outputs.path }}' version --json | python -c 'import json,sys; print(json.load(sys.stdin)["version"])')"
          test -n "$VERSION"
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Assemble source-free staging release
        run: >-
          python tools/assemble_solohost_staging_v1.py
          --binary '${{ steps.binary.outputs.path }}'
          --output out/release
          --version '${{ steps.version.outputs.value }}'
          --platform linux-x86_64
          --source-commit '${{ github.sha }}'
          --smoke-receipt out/smoke.json
      - name: Sign Testnet release with ephemeral CI key
        shell: bash
        run: |
          openssl genpkey -algorithm ED25519 -out "$RUNNER_TEMP/testnet-ed25519.pem"
          python tools/sign_solohost_release_v1.py out/release --private-key "$RUNNER_TEMP/testnet-ed25519.pem"
          openssl pkey -in "$RUNNER_TEMP/testnet-ed25519.pem" -pubout -out out/release/koschei-testnet-release-public.pem
          printf '%s\n' 'TESTNET RELEASE: ephemeral CI signing identity; not a production trust anchor.' > out/release/TESTNET-NOTICE.txt
      - name: Add receipts and archive
        shell: bash
        run: |
          cp out/smoke.json out/release/koschei-solohost-smoke-receipt.json
          cp out/build/koschei-solohost-build-receipt.json out/release/ 2>/dev/null || true
          (cd out && zip -9 -r "koschei-lang-${{ steps.version.outputs.value }}-testnet-linux-x86_64.zip" release)
          sha256sum out/koschei-lang-*-testnet-linux-x86_64.zip > out/package.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: koschei-lang-testnet-linux-x86_64
          path: |
            out/koschei-lang-*-testnet-linux-x86_64.zip
            out/package.sha256
          if-no-files-found: error
          retention-days: 7
