name: formal

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "formal/**"
      - "koschei/packages_v1.py"
      - "koschei/registry_v1.py"
      - "tests/test_formal_models_v1.py"

permissions:
  contents: read

jobs:
  tlc:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch TLA+ tools
        run: |
          curl -sSL -o "$RUNNER_TEMP/tla2tools.jar" https://github.com/tlaplus/tlaplus/releases/download/v1.8.0/tla2tools.jar
          echo "fdffef247f563ef6edbfd44958d2a82db79e7564e07cb673262d896353fa6713  $RUNNER_TEMP/tla2tools.jar" | sha256sum -c -
          echo "KOSCHEI_TLA2TOOLS=$RUNNER_TEMP/tla2tools.jar" >> "$GITHUB_ENV"
      - name: Model check
        run: python -m unittest -v tests.test_formal_models_v1
