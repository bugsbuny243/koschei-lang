name: V5 Generic Aggregates Bootstrap

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/v5-generic-aggregates'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: agent/v5-generic-aggregates
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Apply, validate, and commit implementation once
        shell: bash
        run: |
          set -euo pipefail
          if test -f tests/test_generic_aggregates_v5.py; then
            echo 'generic aggregate implementation already committed'
            exit 0
          fi
          base64 -d tools/v5-generic-aggregates.patch.gz.b64 | gzip -d > /tmp/v5-generic-aggregates.patch
          echo 'b5f5ef53bbcc25e0221eaec8be69f686bf409c5cd699b60eca6ccda9c945d373  /tmp/v5-generic-aggregates.patch' | sha256sum -c -
          git apply --check /tmp/v5-generic-aggregates.patch
          git apply /tmp/v5-generic-aggregates.patch
          python -m pip install -e .
          python -m py_compile koschei/*.py tests/test_generic_aggregates_v5.py
          python -m unittest discover -s tests -q
          git config user.name 'Koschei CI'
          git config user.email 'actions@users.noreply.github.com'
          git add koschei tests/test_generic_aggregates_v5.py
          git commit -m 'v5: add generic structs and enums'
          git push origin HEAD:agent/v5-generic-aggregates
