name: V5 Generic Aggregates Bootstrap

on:
  push:
    branches:
      - agent/v5-generic-aggregates

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'bootstrap: stage generic aggregates patch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Decode and verify patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d tools/v5-generic-aggregates.patch.gz.b64 | gzip -d > /tmp/v5-generic-aggregates.patch
          echo 'b5f5ef53bbcc25e0221eaec8be69f686bf409c5cd699b60eca6ccda9c945d373  /tmp/v5-generic-aggregates.patch' | sha256sum -c -
          git apply --check /tmp/v5-generic-aggregates.patch
          git apply /tmp/v5-generic-aggregates.patch

      - name: Validate implementation
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e .
          python -m py_compile koschei/*.py tests/test_generic_aggregates_v5.py
          python -m unittest discover -s tests -q

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Koschei CI'
          git config user.email 'actions@users.noreply.github.com'
          git add koschei tests/test_generic_aggregates_v5.py
          git commit -m 'v5: add generic structs and enums'
          git push origin HEAD:agent/v5-generic-aggregates
