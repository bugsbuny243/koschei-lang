name: V5 MIR CFG Bootstrap
on:
  pull_request:
permissions:
  contents: write
jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/v5-mir-cfg'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v5-mir-cfg
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: Apply and validate implementation
        shell: bash
        run: |
          set -euo pipefail
          test -f tools/v5-mir-cfg.patch.gz.b64 || exit 0
          base64 -d tools/v5-mir-cfg.patch.gz.b64 | gzip -d > /tmp/change.patch
          git apply --check /tmp/change.patch
          git apply /tmp/change.patch
          python -m pip install -e .
          python -m unittest discover -s tests -q
          git config user.name 'Koschei CI'
          git config user.email 'actions@users.noreply.github.com'
          git rm tools/v5-mir-cfg.patch.gz.b64 .github/workflows/v5-mir-cfg-bootstrap.yml
          git add -A
          git commit -m 'v5: add normalized MIR control-flow graph'
          git push origin HEAD:agent/v5-mir-cfg
