name: Apply v0.8 stable native modules

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/v0.8-stable-native-modules'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/v0.8-stable-native-modules
          fetch-depth: 0

      - name: Apply verified stable patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/v0.8-stable.part00 \
              .github/v0.8-stable.part01 \
              .github/v0.8-stable.part02 \
              .github/v0.8-stable.part03 \
              .github/v0.8-stable.part04 \
            | base64 --decode | gzip --decompress > /tmp/v0.8-stable.patch
          actual="$(sha256sum /tmp/v0.8-stable.patch | cut -d' ' -f1)"
          test "$actual" = "5a0f37e9866b45c7d2eee6ad56c4b6613ee88bcfccd2161cf741dff48cfaf228"
          git apply --check /tmp/v0.8-stable.patch
          git apply /tmp/v0.8-stable.patch
          rm .github/v0.8-stable.part00
          rm .github/v0.8-stable.part01
          rm .github/v0.8-stable.part02
          rm .github/v0.8-stable.part03
          rm .github/v0.8-stable.part04
          rm .github/workflows/apply-v0.8-stable.yml
          git checkout origin/main -- .github/workflows/tests.yml
          git diff --check

      - name: Run full test suite
        run: python -m unittest discover -s tests -v

      - name: Validate examples
        shell: bash
        run: |
          set -euo pipefail
          for file in examples/*.ks; do
            python -m koschei check "$file"
            python -m koschei fmt --check "$file"
          done

      - name: Validate native struct and module parity
        shell: bash
        run: |
          set -euo pipefail
          python -m koschei build examples/holders.ks -o /tmp/koschei-holders
          test "$(/tmp/koschei-holders)" = "$(python -m koschei run examples/holders.ks)"
          python -m koschei build examples/app.ks -o /tmp/koschei-app
          test "$(/tmp/koschei-app)" = "$(python -m koschei run examples/app.ks)"

      - name: Build stable wheel
        run: python -m pip wheel . --no-deps --no-build-isolation -w /tmp/wheel

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build dist koschei_lang.egg-info
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "v0.8: complete native language parity"
          git push origin HEAD:agent/v0.8-stable-native-modules
