name: Koschei Business Web acceptance

on:
  push:
    branches:
      - 'staging/lang-public-business-*'
  pull_request:
    branches:
      - main
      - security/playground-site-only-20261115
    paths:
      - 'products/business_web/**'
      - 'commercial/lang-site/**'
      - 'server/playground/**'
      - 'tests/test_business_web_v1.py'
      - '.github/workflows/business-web.yml'

permissions:
  contents: read

jobs:
  business-web:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the current Koschei runtime and pytest
        run: python -m pip install -e . pytest
      - name: Verify real Koschei calculations, HTTP CSP and disabled Playground
        run: python -m pytest -q tests/test_business_web_v1.py tests/test_lang_public_site_v1.py
      - name: Verify source is valid and capability scope is input-only
        run: |
          ks check products/business_web/engine.ks
          ks caps products/business_web/engine.ks
