name: Generic Diagnostic

on:
  push:
    branches:
      - agent/v5-wave4-generic-functions-v2
  pull_request:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
      - run: python -m pip install -e .
      - name: Capture unit test output
        id: tests
        continue-on-error: true
        run: python -m unittest discover -s tests > generic-test.log 2>&1
      - name: Upload diagnostic log
        uses: actions/upload-artifact@v4
        with:
          name: generic-test-log
          path: generic-test.log
      - name: Preserve failure status
        if: steps.tests.outcome == 'failure'
        run: exit 1
