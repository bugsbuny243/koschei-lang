name: Typestate Diagnostic

on:
  pull_request:
    branches: [main]

jobs:
  focused:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - run: python -m pip install -e .
      - name: Focused typestate tests
        run: python -m unittest -v tests.test_typestate_resources_v1
